<!DOCTYPE html>
<html style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫓</text></svg>"
    />
    <title>dough</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <nav>
      <div>
        <h1>dough</h1>
        <div>
          <a href="/index.html">tutorial</a>
          <a href="/reference.html" style="color: yellow">reference</a>
          <a href="/bakery">bakery</a>
        </div>
      </div>
    </nav>

    <!--  style="display: flex; flex-direction: row; height: 100%" -->
    <main>
      <!--   -->
      <section id="reference">
        <h2>dough reference</h2>
        <p>
          here's a list of all supported parameters in <a href="/">dough</a>,
          including usage examples:
        </p>
      </section>
    </main>
    <!-- Dough -->
    <script type="module">
      import { dough, reference } from "./mini-repl.js";
      function renderReference(dough, target) {
        target.insertAdjacentHTML(
          "beforeend",
          `<div>${reference
            .map((entry) => `<a href="#${entry.name}">${entry.name}</a> `)
            .join("\n")}</div>`
        );

        reference.forEach((entry) => {
          target.insertAdjacentHTML(
            "beforeend",
            `
<div>
  <h3 id="${entry.name}">${entry.name}</h3>
  <p>${entry.description}</p>
  ${entry.examples
    .map(
      (example) => `<mini-repl rows="${example.split("\n").length + 1}"><!--
${example}
--></mini-repl>`
    )
    .join("\n")}
  </div>`
          );
        });
      }
      renderReference(dough, document.getElementById("reference"));
    </script>
  </body>
</html>
