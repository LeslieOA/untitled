<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generative</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      padding: 8px 16px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #666;
    }
    #status { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: background 0.2s; }
    #status.playing { background: #4eff91; box-shadow: 0 0 6px #4eff91; }
    #status.error   { background: #ff4e4e; }
    #code-display { flex: 1; padding: 24px; overflow: auto; white-space: pre; font-size: 13px; line-height: 1.6; color: #a8b5c0; }
    #error-display { padding: 12px 24px; background: #1a0000; color: #ff6b6b; font-size: 12px; display: none; border-top: 1px solid #330000; }
  </style>
</head>
<body>
  <div id="header">
    <div id="status"></div>
    <span>generative</span>
    <span id="filename">waiting…</span>
    <span style="margin-left:auto;color:#444">audio → dough (native)</span>
  </div>
  <pre id="code-display">Save a file in sessions/ to start.</pre>
  <div id="error-display"></div>

  <script type="module">
    // Strudel with OSC output to dough — no Web Audio in browser
    import { evaluate, controls } from '/node_modules/@strudel/core/dist/index.mjs';
    import { mini } from '/node_modules/@strudel/mini/dist/index.mjs';
    import { osc } from '/node_modules/@strudel/osc/osc.mjs';

    // Register mini notation + OSC output
    controls.createParam('s');
    controls.createParam('note');

    const status   = document.getElementById('status');
    const codeEl   = document.getElementById('code-display');
    const errorEl  = document.getElementById('error-display');
    const filenameEl = document.getElementById('filename');

    async function play(code, filename) {
      filenameEl.textContent = filename;
      codeEl.textContent = code;
      errorEl.style.display = 'none';
      try {
        await evaluate(code, { defaultOutput: osc() });
        status.className = 'playing';
      } catch (e) {
        status.className = 'error';
        errorEl.style.display = 'block';
        errorEl.textContent = e.message;
      }
    }

    // Live reload via our file-watcher WebSocket
    function connect() {
      const ws = new WebSocket(`ws://localhost:3000`);
      ws.onmessage = ({ data }) => {
        const msg = JSON.parse(data);
        if (msg.type === 'update') play(msg.code, msg.filename);
      };
      ws.onclose = () => setTimeout(connect, 1000);
    }
    connect();
  </script>
</body>
</html>
